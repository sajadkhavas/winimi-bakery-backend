name: F31 one-shot push test diagnostic
on:
  push:
    paths:
      - '.github/workflows/f31-one-shot-push-test.yml'
permissions:
  contents: write
jobs:
  diagnose:
    if: github.ref == 'refs/heads/f31/final-acceptance-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f31/final-acceptance-handoff
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test tests/Feature/WebPushSubscriptionTest.php > f31-test-output.txt 2>&1 || true
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add f31-test-output.txt
          git commit -m "chore: capture temporary F31 push test diagnostic"
          git push origin HEAD:f31/final-acceptance-handoff
