name: F31 final push test diagnostic
on:
  push:
    paths:
      - '.github/workflows/f31-final-push-test.yml'
permissions:
  contents: write
jobs:
  test:
    if: github.ref == 'refs/heads/f31/final-acceptance-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: f31/final-acceptance-handoff }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test > /tmp/f31-full-test.txt 2>&1 || true\n      - run: tail -n 350 /tmp/f31-full-test.txt > f31-final-push-test.txt
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add f31-final-push-test.txt
          git commit -m "chore: capture final temporary push diagnostic"
          git push origin HEAD:f31/final-acceptance-handoff
