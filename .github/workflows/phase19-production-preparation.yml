name: Phase 19 Production Package

on:
  push:
    branches:
      - "agent/phase-19-*"
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: phase19-backend-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: testing
  APP_DEBUG: "true"
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  MAIL_MAILER: array
  TELESCOPE_ENABLED: "false"
  PULSE_ENABLED: "false"

jobs:
  package:
    name: Verify immutable Laravel production package
    runs-on: ubuntu-latest
    timeout-minutes: 38

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install admin asset dependencies
        run: npm ci

      - name: Build Winimi Filament admin theme
        run: |
          npm run build:admin
          test -s public/build-admin/manifest.json
          grep -q 'resources/css/filament/admin/theme.css' public/build-admin/manifest.json

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          mkdir -p database storage/framework/sessions storage/framework/cache storage/framework/views
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan optimize:clear

      - name: Run existing backend validation
        run: composer check

      - name: Audit Phase 19 production package
        run: php scripts/audit-phase19-production-preparation.php

      - name: Validate shell syntax
        run: |
          for script in deploy/bin/*.sh; do
            bash -n "$script"
          done

      - name: Validate Nginx API virtual host
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo mkdir -p /etc/letsencrypt/live/api.winimibakery.com
          sudo openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /etc/letsencrypt/live/api.winimibakery.com/privkey.pem \
            -out /etc/letsencrypt/live/api.winimibakery.com/fullchain.pem \
            -days 1 -subj '/CN=api.winimibakery.com' \
            -addext 'subjectAltName=DNS:api.winimibakery.com'
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo cp deploy/nginx/winimi-api.conf.example /etc/nginx/sites-enabled/winimi-api.conf
          sudo nginx -t

      - name: Validate systemd units
        run: |
          sudo useradd --system --home /var/www/winimi --shell /usr/sbin/nologin winimi || true
          sudo mkdir -p /var/www/winimi/backend/current/bootstrap/cache /var/www/winimi/backend/shared/storage /var/www/winimi/backups
          sudo systemd-analyze verify \
            deploy/systemd/winimi-backend-queue.service \
            deploy/systemd/winimi-backend-scheduler.service \
            deploy/systemd/winimi-backend-scheduler.timer \
            deploy/systemd/winimi-backend-backup.service \
            deploy/systemd/winimi-backend-backup.timer

      - name: Install optimized production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Create and verify backend release
        run: |
          set -o pipefail
          test -s public/build-admin/manifest.json
          rm -f backend-release-output.json phase19-production-preparation-audit.json
          php scripts/create-backend-release.php . .phase19-release 2>&1 | tee backend-release-create.log
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("backend-release-output.json"));fs.writeFileSync("backend-release-path.txt",x.releaseDir);fs.writeFileSync("backend-release-id.txt",x.releaseId)'
          RELEASE_DIR="$(cat backend-release-path.txt)"
          test -s "$RELEASE_DIR/app/public/build-admin/manifest.json"
          php scripts/verify-backend-release.php "$RELEASE_DIR" 2>&1 | tee backend-release-verify.log

      - name: Prove tamper detection
        run: |
          cp -a "$(cat backend-release-path.txt)" .tampered-backend-release
          printf '\nphase19-tamper\n' >> .tampered-backend-release/app/artisan
          if php scripts/verify-backend-release.php .tampered-backend-release; then
            echo 'Tampered backend release was incorrectly accepted.' >&2
            exit 1
          fi

      - name: Validate state-aware production preflight contract
        env:
          WINIMI_PREFLIGHT_TEST_MODE: "true"
          BACKEND_DEPLOY_ROOT: /tmp/winimi-backend-preflight
          BACKEND_MIN_FREE_KIB: "1"
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/winimi-preflight"

          write_common_env() {
            cat <<'ENV'
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=https://api.winimibakery.com
          SESSION_DOMAIN=.winimibakery.com
          SESSION_SECURE_COOKIE=true
          SESSION_HTTP_ONLY=true
          SESSION_ENCRYPT=true
          LEGACY_TOOLMASTER_API_ENABLED=false
          SEED_WINIMI_STAGING=false
          OTP_EXPOSE_TEST_CODE=false
          APP_KEY=base64:phase19-preflight-key
          DB_PASSWORD=phase19-db-password
          BACKUP_ARCHIVE_PASSWORD=phase19-backup-password
          ENV
          }

          run_preflight() {
            BACKEND_ENV_FILE="$1" bash deploy/bin/preflight-backend-server.sh
          }

          expect_preflight_failure() {
            local file=$1
            local label=$2
            if run_preflight "$file"; then
              echo "Preflight incorrectly accepted negative case: $label" >&2
              exit 1
            fi
          }

          DISABLED_ENV="$RUNNER_TEMP/winimi-preflight/disabled.env"
          {
            write_common_env
            cat <<'ENV'
          CHECKOUT_ENABLED=false
          PAYMENT_ENABLED=false
          PAYMENT_PROVIDER=disabled
          ZARINPAL_MERCHANT_ID=dormant-credential-is-allowed
          ZARINPAL_SANDBOX=false
          GOOGLE_AUTH_ENABLED=false
          GOOGLE_CLIENT_ID=dormant-google-id
          GOOGLE_CLIENT_SECRET=dormant-google-secret
          GOOGLE_REDIRECT_URI=https://api.winimibakery.com/api/v1/auth/google/callback
          OTP_ENABLED=false
          SMS_PROVIDER=disabled
          ORDER_SMS_PROVIDER=disabled
          KAVENEGAR_API_KEY=dormant-kavenegar-key
          KAVENEGAR_TEMPLATE=dormant-template
          KAVENEGAR_ORDER_SENDER=dormant-sender
          PUSH_ENABLED=false
          VAPID_SUBJECT=mailto:ops@winimibakery.com
          VAPID_PUBLIC_KEY=dormant-public-key
          VAPID_PRIVATE_KEY=dormant-private-key
          ENV
          } > "$DISABLED_ENV"
          run_preflight "$DISABLED_ENV"

          ENABLED_ENV="$RUNNER_TEMP/winimi-preflight/enabled.env"
          {
            write_common_env
            cat <<'ENV'
          CHECKOUT_ENABLED=true
          PAYMENT_ENABLED=true
          PAYMENT_PROVIDER=zarinpal
          ZARINPAL_MERCHANT_ID=phase19-zarinpal-merchant
          ZARINPAL_SANDBOX=false
          GOOGLE_AUTH_ENABLED=true
          GOOGLE_CLIENT_ID=phase19-google-client
          GOOGLE_CLIENT_SECRET=phase19-google-secret
          GOOGLE_REDIRECT_URI=https://api.winimibakery.com/auth/google/callback
          OTP_ENABLED=true
          SMS_PROVIDER=kavenegar
          ORDER_SMS_PROVIDER=kavenegar
          KAVENEGAR_API_KEY=phase19-kavenegar-key
          KAVENEGAR_TEMPLATE=phase19-template
          KAVENEGAR_ORDER_SENDER=phase19-sender
          PUSH_ENABLED=true
          VAPID_SUBJECT=mailto:ops@winimibakery.com
          VAPID_PUBLIC_KEY=phase19-vapid-public-key
          VAPID_PRIVATE_KEY=phase19-vapid-private-key
          ENV
          } > "$ENABLED_ENV"
          run_preflight "$ENABLED_ENV"

          BAD_PAYMENT_PROVIDER="$RUNNER_TEMP/winimi-preflight/bad-payment-provider.env"
          sed 's/^PAYMENT_PROVIDER=zarinpal$/PAYMENT_PROVIDER=disabled/' "$ENABLED_ENV" > "$BAD_PAYMENT_PROVIDER"
          expect_preflight_failure "$BAD_PAYMENT_PROVIDER" 'payment enabled with disabled provider'

          BAD_PAYMENT_SECRET="$RUNNER_TEMP/winimi-preflight/bad-payment-secret.env"
          sed 's/^ZARINPAL_MERCHANT_ID=.*/ZARINPAL_MERCHANT_ID=/' "$ENABLED_ENV" > "$BAD_PAYMENT_SECRET"
          expect_preflight_failure "$BAD_PAYMENT_SECRET" 'payment enabled without merchant id'

          TESTING_PAYMENT="$RUNNER_TEMP/winimi-preflight/testing-payment.env"
          sed 's/^PAYMENT_PROVIDER=zarinpal$/PAYMENT_PROVIDER=testing/' "$ENABLED_ENV" > "$TESTING_PAYMENT"
          expect_preflight_failure "$TESTING_PAYMENT" 'testing payment provider in production'

          BAD_GOOGLE="$RUNNER_TEMP/winimi-preflight/bad-google.env"
          sed 's/^GOOGLE_CLIENT_SECRET=.*/GOOGLE_CLIENT_SECRET=/' "$ENABLED_ENV" > "$BAD_GOOGLE"
          expect_preflight_failure "$BAD_GOOGLE" 'Google enabled without client secret'

          BAD_GOOGLE_REDIRECT="$RUNNER_TEMP/winimi-preflight/bad-google-redirect.env"
          sed 's#^GOOGLE_REDIRECT_URI=.*#GOOGLE_REDIRECT_URI=https://api.winimibakery.com/api/v1/auth/google/callback#' "$ENABLED_ENV" > "$BAD_GOOGLE_REDIRECT"
          expect_preflight_failure "$BAD_GOOGLE_REDIRECT" 'Google enabled with a non-canonical callback'

          TESTING_SMS="$RUNNER_TEMP/winimi-preflight/testing-sms.env"
          sed 's/^SMS_PROVIDER=kavenegar$/SMS_PROVIDER=testing/' "$ENABLED_ENV" > "$TESTING_SMS"
          expect_preflight_failure "$TESTING_SMS" 'testing OTP provider in production'

          DISABLED_OTP_PROVIDER="$RUNNER_TEMP/winimi-preflight/disabled-otp-provider.env"
          sed 's/^SMS_PROVIDER=kavenegar$/SMS_PROVIDER=disabled/' "$ENABLED_ENV" > "$DISABLED_OTP_PROVIDER"
          expect_preflight_failure "$DISABLED_OTP_PROVIDER" 'OTP enabled with disabled provider'

          BAD_KAVENEGAR_TEMPLATE="$RUNNER_TEMP/winimi-preflight/bad-kavenegar-template.env"
          sed 's/^KAVENEGAR_TEMPLATE=.*/KAVENEGAR_TEMPLATE=/' "$ENABLED_ENV" > "$BAD_KAVENEGAR_TEMPLATE"
          expect_preflight_failure "$BAD_KAVENEGAR_TEMPLATE" 'Kavenegar OTP without template'

          BAD_VAPID_KEY="$RUNNER_TEMP/winimi-preflight/bad-vapid-key.env"
          sed 's/^VAPID_PRIVATE_KEY=.*/VAPID_PRIVATE_KEY=/' "$ENABLED_ENV" > "$BAD_VAPID_KEY"
          expect_preflight_failure "$BAD_VAPID_KEY" 'web push enabled without private key'

      - name: Upload Phase 19 package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19-backend-production-package
          path: |
            phase19-production-preparation-audit.json
            backend-release-create.log
            backend-release-verify.log
            backend-release-output.json
            backend-release-id.txt
            backend-release-path.txt
            public/build-admin/manifest.json
            .phase19-release/backend-*/release-manifest.json
          if-no-files-found: warn
          retention-days: 14
