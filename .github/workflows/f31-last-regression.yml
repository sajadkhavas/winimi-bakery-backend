name: F31 last regression diagnostic
on:
  push:
    paths:
      - '.github/workflows/f31-last-regression.yml'
permissions:
  contents: write
jobs:
  test:
    if: github.ref == 'refs/heads/f31/final-acceptance-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f31/final-acceptance-handoff
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test > /tmp/full.txt 2>&1 || true
      - run: tail -n 180 /tmp/full.txt > f31-last-regression.txt
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add f31-last-regression.txt
          git commit -m "chore: capture temporary last regression after readiness fix"
          git push origin HEAD:f31/final-acceptance-handoff
