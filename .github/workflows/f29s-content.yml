name: F29S Content Foundation

on:
  push:
    branches:
      - 'phase-29s-d/**'
      - 'phase-29s/**'
  pull_request:
    branches:
      - 'phase-29s/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-foundation:
    name: Validate controlled SEO guide foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TELESCOPE_ENABLED: false
      PULSE_ENABLED: false

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          mkdir -p database
          : > database/database.sqlite
          php artisan key:generate --force
          php artisan optimize:clear

      - name: Migrate database
        run: php artisan migrate:fresh --force

      - name: Dry-run controlled guide manifest
        run: |
          set -o pipefail
          php artisan content:sync-seo-guides | tee /tmp/f29s-guide-dry-run.log
          grep -F 'MODE=DRY_RUN' /tmp/f29s-guide-dry-run.log
          grep -F 'VALID_GUIDES=5' /tmp/f29s-guide-dry-run.log
          grep -F 'DATABASE_MUTATIONS=0' /tmp/f29s-guide-dry-run.log
          grep -E '^MANIFEST_SHA256=[a-f0-9]{64}$' /tmp/f29s-guide-dry-run.log

      - name: Run F29S guide foundation tests
        run: php artisan test tests/Feature/SeoGuideFoundationTest.php

      - name: Check formatting of F29S PHP changes
        run: |
          ./vendor/bin/pint --test \
            app/Support/Content/SeoGuideManifest.php \
            app/Console/Commands/SyncSeoGuides.php \
            database/seeders/SeoGuideStagingSeeder.php \
            tests/Feature/SeoGuideFoundationTest.php

      - name: Verify production-safe staging boundary
        run: |
          grep -F "app()->environment('production')" database/seeders/SeoGuideStagingSeeder.php
          grep -F -- '--expected-sha256=' app/Console/Commands/SyncSeoGuides.php
          grep -F -- '--confirm=' app/Console/Commands/SyncSeoGuides.php
          grep -F -- '--publish' app/Console/Commands/SyncSeoGuides.php

      - name: F29S content gate summary
        run: |
          echo 'F29S_D_BACKEND_CONTENT_GATE=PASS'
          echo "EXACT_HEAD=${GITHUB_SHA}"
          echo 'PRODUCTION_MUTATION=NO'
