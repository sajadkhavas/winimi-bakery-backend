name: F31 one-shot web-push dependency
on:
  push:
    paths:
      - '.github/workflows/f31-one-shot-web-push-dependency.yml'
permissions:
  contents: write
jobs:
  dependency:
    if: github.ref == 'refs/heads/f31/final-acceptance-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f31/final-acceptance-handoff
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer require minishlink/web-push:^9.0 --no-interaction --no-scripts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.json composer.lock
          git commit -m "build: add locked web push transport"
          git push origin HEAD:f31/final-acceptance-handoff
