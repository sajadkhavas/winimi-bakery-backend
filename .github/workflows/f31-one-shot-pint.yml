name: F31 one-shot Pint formatter
on:
  push:
    paths:
      - '.github/workflows/f31-one-shot-pint.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/f31/final-acceptance-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f31/final-acceptance-handoff
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint app/Filament/Resources/BakeryProductResource.php app/Http/Controllers/Api/StoreContentController.php app/Http/Controllers/Api/WebPushController.php app/Http/Resources/BakeryProductResource.php app/Models/BakeryProduct.php app/Models/Customer.php app/Models/WebPushSubscription.php config/winimi.php routes/api.php database/migrations/2026_09_09_090000_create_web_push_subscriptions_table.php database/migrations/2026_09_09_091000_add_rich_content_to_bakery_products.php tests/Feature/WebPushSubscriptionTest.php
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "style: apply locked Pint formatter"
          git push origin HEAD:f31/final-acceptance-handoff
