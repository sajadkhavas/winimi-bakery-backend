name: F31 Composer Lock

on:
  push:
    branches:
      - f31/final-acceptance-handoff

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json, mbstring, openssl
          tools: composer:v2
          coverage: none
      - run: composer update minishlink/web-push --with-all-dependencies --no-interaction --no-progress
      - run: composer validate --no-check-publish
      - uses: actions/upload-artifact@v4
        with:
          name: f31-composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
