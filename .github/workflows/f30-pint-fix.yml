name: F30 Pint Repair

on:
  push:
    branches:
      - 'phase-30-a/storefront-backend-authority'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30-a/storefront-backend-authority
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply F30 formatting
        run: |
          vendor/bin/pint \
            app/Filament/Resources/StoreSettingResource.php \
            app/Filament/Resources/StoreSettingResource/Pages/ManageStoreSettings.php \
            app/Filament/Resources/BakeryCategoryLandingResource.php \
            app/Filament/Resources/BakeryCategoryLandingResource/Pages/ManageBakeryCategoryLandings.php \
            app/Models/BakeryCategoryLanding.php \
            app/Http/Controllers/Api/CatalogController.php \
            database/migrations/2026_09_06_153500_seed_storefront_authority.php \
            database/migrations/2026_09_06_160000_create_bakery_category_landings.php \
            database/migrations/2026_09_06_161000_add_guides_to_bakery_category_landings.php \
            database/migrations/2026_09_06_162000_seed_category_guide_section_authority.php \
            database/migrations/2026_09_06_165000_seed_public_shell_authority.php \
            tests/Feature/F30StorefrontAuthorityTest.php
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app database tests
          git commit -m 'style(f30): normalize backend authority files'
          git push origin HEAD:phase-30-a/storefront-backend-authority
