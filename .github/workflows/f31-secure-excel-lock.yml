name: F31 secure Excel lock
on:
  push:
    paths:
      - '.github/workflows/f31-secure-excel-lock.yml'
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/f31/final-acceptance-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f31/final-acceptance-handoff
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer update maatwebsite/excel --with-all-dependencies --no-interaction --prefer-dist
      - run: composer audit --no-interaction
      - run: php artisan test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          git commit -m "fix(security): update Laravel Excel beyond CVE-2026-84374"
          git push origin HEAD:f31/final-acceptance-handoff
